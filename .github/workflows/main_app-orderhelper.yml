name: Build WinForms desktop app

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore OrderHelperWinForms/OrderHelperWinForms.csproj

      - name: Build
        run: dotnet build OrderHelperWinForms/OrderHelperWinForms.csproj -c Release --no-restore

      - name: Publish single-file exe
        run: dotnet publish OrderHelperWinForms/OrderHelperWinForms.csproj /p:PublishProfile=SingleFile

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrderHelper-win-x64
          path: OrderHelperWinForms/bin/Publish/
